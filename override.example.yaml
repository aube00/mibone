# === DNS ===
dns:
  enable: true
  listen: "0.0.0.0:1053"
  ipv6: true
  use-system-hosts: false
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: "198.18.0.1/16"
  fake-ip-filter:
    - "geosite:cn"
    - "geosite:private"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "*.ntp.org.cn"
    - "pool.ntp.org"
    # 国内 AI 服务
    - "+.deepseek.com"
    - "+.aliyuncs.com"
    - "+.dashscope.cn"
    - "+.bigmodel.cn"
    - "+.stepfun.com"
    - "+.baichuan-ai.com"
    - "+.moonshot.cn"
    - "+.volcengineapi.com"
    - "+.volces.com"
    - "+.baidubce.com"
    - "+.minimaxi.com"
    - "+.lingyiwanwu.com"
    - "+.siliconflow.cn"
    # Steam 支付/登录 (风控要求真实 IP)
    - "+.store.steampowered.com"
    - "+.checkout.steampowered.com"
    - "+.api.steampowered.com"
    - "+.login.steampowered.com"
    - "+.help.steampowered.com"
    # 飞书
    - "+.feishu.cn"
    - "+.larksuite.com"
    - "+.larksuit.com"
    - "+.feishucdn.com"
    # Telegram
    - "+.telegram.org"
    - "+.t.me"
  default-nameserver:
    - "223.5.5.5"
    - "119.29.29.29"
    - "1.1.1.1"
    - "8.8.8.8"
  nameserver:
    - "https://dns.alidns.com/dns-query"
    - "https://doh.pub/dns-query"
  proxy-server-nameserver:
    - "https://doh.pub/dns-query"
    - "https://dns.alidns.com/dns-query"
  direct-nameserver:
    - "https://dns.alidns.com/dns-query"
    - "https://doh.pub/dns-query"
  fallback:
    - "https://1.1.1.1/dns-query"
    - "https://dns.google/dns-query"
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite: ["gfw"]
    ipcidr: ["240.0.0.0/4"]
    domain:
      - "+.google.com"
      - "+.facebook.com"
      - "+.youtube.com"
      - "+.twitter.com"
      - "+.github.com"
  nameserver-policy:
