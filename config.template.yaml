# === DNS ===
dns:
  enable: true
  listen: "0.0.0.0:1053"
  ipv6: true
  use-system-hosts: false
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: "198.18.0.1/16"
  fake-ip-filter:
    - "geosite:cn"
    - "geosite:private"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "*.ntp.org.cn"
    - "pool.ntp.org"
    - "+.deepseek.com"
    - "+.aliyuncs.com"
    - "+.dashscope.cn"
    - "+.bigmodel.cn"
    - "+.stepfun.com"
    - "+.moonshot.cn"
    - "+.volcengineapi.com"
    - "+.siliconflow.cn"
    - "+.store.steampowered.com"
    - "+.checkout.steampowered.com"
    - "+.api.steampowered.com"
    - "+.login.steampowered.com"
    - "+.telegram.org"
    - "+.t.me"
  default-nameserver:
    - "223.5.5.5"
    - "119.29.29.29"
    - "1.1.1.1"
    - "8.8.8.8"
  nameserver:
    - "https://dns.alidns.com/dns-query"
    - "https://doh.pub/dns-query"
  proxy-server-nameserver:
    - "https://doh.pub/dns-query"
    - "https://dns.alidns.com/dns-query"
  direct-nameserver:
    - "https://dns.alidns.com/dns-query"
    - "https://doh.pub/dns-query"
  fallback:
    - "https://1.1.1.1/dns-query"
    - "https://dns.google/dns-query"
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite: ["gfw"]
    ipcidr: ["240.0.0.0/4"]
    domain:
      - "+.google.com"
      - "+.facebook.com"
      - "+.youtube.com"
      - "+.twitter.com"
      - "+.github.com"
  nameserver-policy:
    "+.deepseek.com,+.aliyuncs.com,+.dashscope.cn,+.bigmodel.cn,+.moonshot.cn,+.volcengineapi.com,+.siliconflow.cn,+.stepfun.com":
      - "https://dns.alidns.com/dns-query"
      - "https://doh.pub/dns-query"
    "+.github.com,+.githubusercontent.com,+.githubassets.com,+.docker.io,+.docker.com,+.ghcr.io,+.gcr.io,+.nvcr.io":
      - "https://dns.google/dns-query"
      - "https://1.1.1.1/dns-query"
    "+.anthropic.com,+.claude.ai,+.openai.com,+.chatgpt.com,+.huggingface.co":
      - "https://dns.google/dns-query"
      - "https://1.1.1.1/dns-query"
    "+.steamcontent.com,+.steamserver.net,+.cs.steampowered.com,+.store.steampowered.com,+.checkout.steampowered.com,+.api.steampowered.com,+.login.steampowered.com":
      - "https://dns.alidns.com/dns-query"
      - "https://doh.pub/dns-query"
    "geosite:cn":
      - "https://dns.alidns.com/dns-query"
      - "https://doh.pub/dns-query"
